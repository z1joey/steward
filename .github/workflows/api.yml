name: API tests

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: steward
          POSTGRES_PASSWORD: steward
          POSTGRES_DB: steward_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U steward -d steward_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # alembic upgrade 用；conftest.py 会以 STEWARDS_TEST_DATABASE_URL 覆盖，
      # pytest 连接串必须经后者传入（缺省为无凭据 localhost，CI 会挂）。
      STEWARDS_DATABASE_URL: postgresql+psycopg://steward:steward@localhost:5432/steward_test
      STEWARDS_TEST_DATABASE_URL: postgresql+psycopg://steward:steward@localhost:5432/steward_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - run: uv run pytest -v
