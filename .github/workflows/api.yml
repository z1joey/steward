name: API tests

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  # TF-06 · P0 + P1 门禁（testing.md §5）：API/数据层全量必过（required）
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: steward
          POSTGRES_PASSWORD: steward
          POSTGRES_DB: steward_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U steward -d steward_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # alembic upgrade 用；conftest.py 会以 STEWARDS_TEST_DATABASE_URL 覆盖，
      # pytest 连接串必须经后者传入（缺省为无凭据 localhost，CI 会挂）。
      STEWARDS_DATABASE_URL: postgresql+psycopg://steward:steward@localhost:5432/steward_test
      STEWARDS_TEST_DATABASE_URL: postgresql+psycopg://steward:steward@localhost:5432/steward_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      # TF-06 · P0 集合（testing §5）单跑并失败即退出：CL-02/03 · DIV-01/02 ·
      # TR-01/02 · PAY-02/03 · CON-01/03 · ISO-01
      - name: P0 gate (required)
        run: |
          uv run pytest -v \
            "tests/test_claims.py::test_t_cl_02_claim_pending_balance_untouched" \
            "tests/test_claims.py::test_t_cl_03_approve_posts_entry_txn_balance_atomically" \
            "tests/test_dividend.py::test_t_div_01_confirm_within_balance_posts_and_deducts" \
            "tests/test_dividend.py::test_t_div_02_confirm_over_balance_rejected_zero_side_effects" \
            "tests/test_transfers.py::test_t_tr_01_external_target_existing_managers_unaffected" \
            "tests/test_transfers.py::test_t_tr_01_target_already_store_manager_promoted" \
            "tests/test_transfers.py::test_t_tr_02_stale_transfer_conflict" \
            "tests/test_transfers.py::test_t_tr_02_double_accept_one_success" \
            "tests/test_payroll.py::test_t_pay_02_settle_posts_entry_matching_line" \
            "tests/test_payroll.py::test_t_pay_03_sm_settle_denied" \
            "tests/test_concurrency.py::test_t_con_01_invite_accept_stale_version" \
            "tests/test_concurrency.py::test_t_con_01_transfer_accept_stale_version" \
            "tests/test_concurrency.py::test_t_con_01_claim_approve_stale_version" \
            "tests/test_concurrency.py::test_t_con_03_concurrent_approve_exactly_one_entry" \
            "tests/test_settings_members.py::test_t_iso_01_store_header_without_membership"
      # TF-06 · P1 全量（required）
      - run: uv run pytest -v

  # TF-06 · P2 e2e（允许 pending/抖动）：不阻塞合并
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: steward
          POSTGRES_PASSWORD: steward
          POSTGRES_DB: steward_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U steward -d steward_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql+psycopg://steward:steward@localhost:5432/steward_e2e
      STEWARDS_TEST_PASSWORD: pw-e2e-ci-1234
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
